name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web-build ]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 3. Unity 빌드
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web-Desktop-Dev - Desktop - Development.asset"

      # 4. 빌드 결과물 업로드 (Artifact)
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

      # 5. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 7. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 8. 슬랙 알림 (성공) - curl + jq로 JSON 안전하게 생성
      - name: Slack Notification (Success)
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg play_url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            '{
              text: "✅ WebGL 빌드 & 배포 성공",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("✅ *" + $repo + "* 빌드 & 배포 완료!\n📝 커밋: " + ($commit | split("\n")[0]) + "\n👤 작성자: " + $actor + "(노민균)" + "\n🌐 <" + $play_url + "|플레이하기>")
                  }
                }
              ]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$SLACK_WEBHOOK"

      # 9. 빌드 실패 시 → GitHub Actions API로 빌드 로그 추출 + Gemini 분석
      - name: Analyze Failure with Gemini
        if: failure()
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub Actions API로 "Build WebGL" 스텝의 실제 로그 가져오기
          JOBS_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")

          # 실패한 스텝이 있는 job의 ID 추출
          JOB_ID=$(echo "$JOBS_JSON" | jq -r '.jobs[0].id')

          ERROR_LOG=""
          if [ "$JOB_ID" != "null" ] && [ -n "$JOB_ID" ]; then
            # job 로그 전체 다운로드 (텍스트)
            FULL_LOG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" 2>/dev/null || echo "")

            if [ -n "$FULL_LOG" ]; then
              # 에러 관련 라인만 추출 (마지막 300줄에서)
              ERROR_LOG=$(echo "$FULL_LOG" | tail -300 | grep -A 3 -B 1 -i "error\|fatal\|fail\|exception\|Error CS" | head -80)
            fi
          fi

          # 로그 파일 폴백
          if [ -z "$ERROR_LOG" ]; then
            LOG_FILE=$(find . -name "*.log" -not -path "./.git/*" 2>/dev/null | head -1)
            if [ -n "$LOG_FILE" ]; then
              ERROR_LOG=$(tail -200 "$LOG_FILE" | grep -A 5 -B 2 -i "error\|fatal\|fail\|exception" | head -80)
            fi
          fi

          if [ -z "$ERROR_LOG" ]; then
            ERROR_LOG="빌드 로그를 자동 추출하지 못했습니다. GitHub Actions 로그를 직접 확인해주세요."
          fi

          echo "::group::Debug - Extracted error log"
          echo "$ERROR_LOG" | head -30
          echo "::endgroup::"

          # API 키 존재 여부 확인
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "analysis<<ANALYSIS_EOF" >> $GITHUB_OUTPUT
            echo "Gemini API 키가 설정되지 않았습니다. GitHub Secrets에 GEMINI_API_KEY를 추가해주세요." >> $GITHUB_OUTPUT
            echo "ANALYSIS_EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Gemini API 호출
          REQUEST_BODY=$(jq -n --arg log "$ERROR_LOG" '{
            contents: [{ parts: [{ text: ("Unity WebGL 빌드 에러 로그를 분석해줘. 반드시 한국어로 답해줘. 포맷: [원인] 한두 줄 / [해결방법] 한두 줄. 간결하게 200자 이내로.\n\n로그:\n" + $log) }] }],
            generationConfig: { maxOutputTokens: 300 }
          }')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            ERROR_MSG=$(echo "$BODY" | jq -r '.error.message // "알 수 없는 오류"')
            ANALYSIS="Gemini API 오류 (HTTP $HTTP_CODE): $ERROR_MSG"
          else
            ANALYSIS=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // "AI 응답 파싱 실패"' | head -10)
          fi

          echo "analysis<<ANALYSIS_EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "ANALYSIS_EOF" >> $GITHUB_OUTPUT

      # 10. 슬랙 알림 (실패 + AI 분석 포함) - curl + jq로 JSON 안전하게 생성
      - name: Slack Notification (Failure)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ANALYSIS: ${{ steps.gemini.outputs.analysis }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg analysis "$ANALYSIS" \
            --arg log_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: "❌ WebGL 빌드 실패",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🔥 *" + $repo + "* 빌드 실패!\n📝 커밋: " + ($commit | split("\n")[0]) + "\n👤 작성자: " + $actor + "(노민균)")
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🤖 *AI 분석 결과:*\n" + $analysis)
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🔗 <" + $log_url + "|전체 로그 확인>")
                  }
                }
              ]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$SLACK_WEBHOOK"