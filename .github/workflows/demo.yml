name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web-build ]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 3. Unity 빌드 (실패해도 계속 진행 → 로그 캡처용)
      - name: Build WebGL
        id: unity-build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web-Desktop-Dev - Desktop - Development.asset"

      # 4. 빌드 실패 시 → Gemini 분석
      - name: Analyze Failure with Gemini
        if: steps.unity-build.outcome == 'failure'
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ERROR_LOG=""

          # 실패한 스텝 정보 가져오기
          JOBS_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED_STEPS=$(echo "$JOBS_JSON" | jq -r '.jobs[0].steps[] | select(.conclusion == "failure") | "Step: \(.name) - Status: \(.conclusion)"')
          echo "::group::Debug - Failed steps"
          echo "$FAILED_STEPS"
          echo "::endgroup::"

          # Unity Editor.log 검색 (game-ci는 _diag/pages/ 하위에 로그 저장)
          echo "Searching for Unity Editor log..."
          FOUND_LOGS=$(find /home/runner "$GITHUB_WORKSPACE" -maxdepth 8 \
            \( -name "Editor.log" -o -name "Editor-prev.log" \) \
            -size +10k 2>/dev/null || true)

          # Editor.log가 없으면 _diag/pages 안의 가장 큰 로그 파일 찾기
          if [ -z "$FOUND_LOGS" ]; then
            FOUND_LOGS=$(find /home/runner -path "*/_diag/pages/*.log" -size +100k 2>/dev/null | head -3 || true)
          fi

          # 찾은 로그 중 에러가 포함된 것을 사용
          for logpath in $FOUND_LOGS; do
            echo "Checking: $logpath ($(wc -l < "$logpath") lines)"
            CONTENT=$(grep -i "error CS\|Build completed with a result of 'Failed'\|Assets/.*error\|CommandInvokationFailure\|Fatal\|UnityException" "$logpath" | tail -40)
            if [ -n "$CONTENT" ]; then
              ERROR_LOG="$CONTENT"
              echo "Found errors in: $logpath"
              break
            fi
          done

          # 에러 키워드가 없으면 가장 큰 로그의 마지막 부분 사용
          if [ -z "$ERROR_LOG" ] && [ -n "$FOUND_LOGS" ]; then
            BIGGEST=$(echo "$FOUND_LOGS" | head -1)
            echo "No error keywords found, using tail of: $BIGGEST"
            ERROR_LOG=$(tail -60 "$BIGGEST")
          fi

          # 폴백: 실패 스텝 정보를 Gemini에 전달
          if [ -z "$ERROR_LOG" ]; then
            ERROR_LOG="Unity WebGL 빌드가 실패했습니다. 실패한 스텝: ${FAILED_STEPS:-Build WebGL}. game-ci/unity-builder@v4 사용. 빌드 프로파일: Web-Desktop-Dev. 로그 파일을 추출할 수 없어 상세 에러 메시지는 확인되지 않았습니다. 일반적인 Unity WebGL 빌드 실패 원인을 분석해주세요."
          fi

          echo "::group::Debug - Error log sent to Gemini"
          echo "$ERROR_LOG" | head -30
          echo "::endgroup::"

          # API 키 확인
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "analysis<<ANALYSIS_EOF" >> $GITHUB_OUTPUT
            echo "Gemini API 키가 미설정. GitHub Secrets에 GEMINI_API_KEY를 추가해주세요." >> $GITHUB_OUTPUT
            echo "ANALYSIS_EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Gemini API 호출
          REQUEST_BODY=$(jq -n --arg log "$ERROR_LOG" '{
            contents: [{ parts: [{ text: ("Unity WebGL 빌드 에러 로그를 분석해줘. 반드시 한국어로 답해줘. 포맷: [원인] 한두 줄 / [해결방법] 한두 줄. 간결하게 200자 이내로.\n\n로그:\n" + $log) }] }],
            generationConfig: { maxOutputTokens: 500 }
          }')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            ERROR_MSG=$(echo "$BODY" | jq -r '.error.message // "알 수 없는 오류"')
            ANALYSIS="Gemini API 오류 (HTTP $HTTP_CODE): $ERROR_MSG"
          else
            ANALYSIS=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // "AI 응답 파싱 실패"' | head -10)
          fi

          echo "analysis<<ANALYSIS_EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "ANALYSIS_EOF" >> $GITHUB_OUTPUT

      # 5. 빌드 실패 시 → 슬랙 알림 (AI 분석 포함)
      - name: Slack Notification (Failure)
        if: steps.unity-build.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ANALYSIS: ${{ steps.gemini.outputs.analysis }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg analysis "$ANALYSIS" \
            --arg log_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: "❌ WebGL 빌드 실패",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🔥 *" + $repo + "* 빌드 실패!\n📝 커밋: " + ($commit | split("\n")[0]) + "\n👤 작성자: " + $actor + "(노민균)")
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🤖 *AI 분석 결과:*\n" + $analysis)
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🔗 <" + $log_url + "|전체 로그 확인>")
                  }
                }
              ]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$SLACK_WEBHOOK"

      # 6. 빌드 실패 시 워크플로우 중단
      - name: Fail workflow if build failed
        if: steps.unity-build.outcome == 'failure'
        run: exit 1

      # 7. 빌드 결과물 업로드 (Artifact)
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

      # 8. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 9. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 10. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 11. 슬랙 알림 (성공)
      - name: Slack Notification (Success)
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg play_url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            '{
              text: "✅ WebGL 빌드 & 배포 성공",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("✅ *" + $repo + "* 빌드 & 배포 완료!\n📝 커밋: " + ($commit | split("\n")[0]) + "\n👤 작성자: " + $actor + "(노민균)" + "\n🌐 <" + $play_url + "|플레이하기>")
                  }
                }
              ]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$SLACK_WEBHOOK"
