name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web-build ]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 3. Unity 빌드 (실패해도 계속 진행 → 로그 캡처용)
      - name: Build WebGL
        id: unity-build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web-Desktop-Dev - Desktop - Development.asset"

      # 4. 빌드 실패 시 → Gemini 분석
      - name: Analyze Failure with Gemini
        if: steps.unity-build.outcome == 'failure'
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 현재 run의 빌드 job 로그를 GitHub API로 가져오기
          # continue-on-error 덕분에 job이 아직 running이지만, 이전 스텝 로그는 접근 가능

          # 방법 1: Docker 빌드 로그 파일 탐색
          ERROR_LOG=""
          for candidate in \
            /home/runner/work/_temp/*.log \
            /home/runner/work/**/*.log \
            ./*.log; do
            found=$(ls $candidate 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "Found log: $found ($(wc -l < "$found") lines)"
              CONTENT=$(grep -A 3 -B 1 -i "error\|fatal\|exception\|Error CS" "$found" | tail -80)
              if [ -n "$CONTENT" ]; then
                ERROR_LOG="$CONTENT"
                break
              fi
            fi
          done

          # 방법 2: docker logs에서 가져오기
          if [ -z "$ERROR_LOG" ]; then
            echo "Trying docker logs..."
            CONTAINER_ID=$(docker ps -aq --latest 2>/dev/null || echo "")
            if [ -n "$CONTAINER_ID" ]; then
              DOCKER_LOG=$(docker logs "$CONTAINER_ID" 2>&1 | tail -300)
              ERROR_LOG=$(echo "$DOCKER_LOG" | grep -A 3 -B 1 -i "error\|fatal\|exception\|Error CS" | tail -80)
              if [ -z "$ERROR_LOG" ]; then
                ERROR_LOG=$(echo "$DOCKER_LOG" | tail -50)
              fi
            fi
          fi

          # 방법 3: find로 전체 탐색
          if [ -z "$ERROR_LOG" ]; then
            echo "Searching all log files..."
            LOG_FILE=$(find /home/runner /github -name "*.log" -size +0 2>/dev/null | head -1)
            if [ -n "$LOG_FILE" ]; then
              echo "Found: $LOG_FILE"
              ERROR_LOG=$(grep -A 3 -B 1 -i "error\|fatal\|exception" "$LOG_FILE" | tail -80)
            fi
          fi

          if [ -z "$ERROR_LOG" ]; then
            ERROR_LOG="빌드 로그를 자동 추출하지 못했습니다. GitHub Actions의 'Build WebGL' 스텝 로그를 직접 확인해주세요."
          fi

          echo "::group::Debug - Error log sent to Gemini"
          echo "$ERROR_LOG" | head -30
          echo "::endgroup::"

          # API 키 확인
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "analysis<<ANALYSIS_EOF" >> $GITHUB_OUTPUT
            echo "Gemini API 키가 설정되지 않았습니다. GitHub Secrets에 GEMINI_API_KEY를 추가해주세요." >> $GITHUB_OUTPUT
            echo "ANALYSIS_EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Gemini API 호출
          REQUEST_BODY=$(jq -n --arg log "$ERROR_LOG" '{
            contents: [{ parts: [{ text: ("Unity WebGL 빌드 에러 로그를 분석해줘. 반드시 한국어로 답해줘. 포맷: [원인] 한두 줄 / [해결방법] 한두 줄. 간결하게 200자 이내로.\n\n로그:\n" + $log) }] }],
            generationConfig: { maxOutputTokens: 300 }
          }')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            ERROR_MSG=$(echo "$BODY" | jq -r '.error.message // "알 수 없는 오류"')
            ANALYSIS="Gemini API 오류 (HTTP $HTTP_CODE): $ERROR_MSG"
          else
            ANALYSIS=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // "AI 응답 파싱 실패"' | head -10)
          fi

          echo "analysis<<ANALYSIS_EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "ANALYSIS_EOF" >> $GITHUB_OUTPUT

      # 5. 빌드 실패 시 → 슬랙 알림 (AI 분석 포함)
      - name: Slack Notification (Failure)
        if: steps.unity-build.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ANALYSIS: ${{ steps.gemini.outputs.analysis }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg analysis "$ANALYSIS" \
            --arg log_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: "❌ WebGL 빌드 실패",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🔥 *" + $repo + "* 빌드 실패!\n📝 커밋: " + ($commit | split("\n")[0]) + "\n👤 작성자: " + $actor + "(노민균)")
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🤖 *AI 분석 결과:*\n" + $analysis)
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("🔗 <" + $log_url + "|전체 로그 확인>")
                  }
                }
              ]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$SLACK_WEBHOOK"

      # 6. 빌드 실패 시 워크플로우 중단
      - name: Fail workflow if build failed
        if: steps.unity-build.outcome == 'failure'
        run: exit 1

      # 7. 빌드 결과물 업로드 (Artifact)
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

      # 8. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 9. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 10. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 11. 슬랙 알림 (성공)
      - name: Slack Notification (Success)
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg play_url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            '{
              text: "✅ WebGL 빌드 & 배포 성공",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("✅ *" + $repo + "* 빌드 & 배포 완료!\n📝 커밋: " + ($commit | split("\n")[0]) + "\n👤 작성자: " + $actor + "(노민균)" + "\n🌐 <" + $play_url + "|플레이하기>")
                  }
                }
              ]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$SLACK_WEBHOOK"
