name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web-build ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 3. Unity 빌드
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web-Desktop-Dev - Desktop - Development.asset"

      # 4. 빌드 결과물 업로드 (Artifact)
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

      # 5. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 7. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 8. 슬랙 알림 (성공)
      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ WebGL 빌드 & 배포 성공"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ✅ *${{ github.repository }}* 빌드 & 배포 완료!
                    📝 커밋: ${{ github.event.head_commit.message }}
                    👤 작성자: ${{ github.actor }}
                    🌐 <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|플레이하기>

      # 9. 빌드 실패 시 → 로그 추출 + Gemini 분석
      - name: Analyze Failure with Gemini
        if: failure()
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 빌드 로그에서 에러 부분만 추출
          LOG_FILE=$(find . -path "*/build/*.log" -o -path "/github/workspace/*.log" 2>/dev/null | head -1)

          if [ -n "$LOG_FILE" ]; then
            ERROR_LOG=$(tail -200 "$LOG_FILE" | grep -A 5 -B 2 -i "error\|fatal\|fail\|exception" | head -100)
          else
            ERROR_LOG=""
          fi

          if [ -z "$ERROR_LOG" ]; then
            ERROR_LOG="빌드 로그 파일을 자동 추출하지 못했습니다. GitHub Actions 로그를 직접 확인해주세요."
          fi

          # Gemini API 호출
          ESCAPED_LOG=$(echo "$ERROR_LOG" | jq -Rs .)
          PROMPT="Unity WebGL 빌드 에러 로그를 분석해줘. 반드시 한국어로 답해줘. 포맷: [원인] 한두 줄 / [해결방법] 한두 줄. 간결하게 200자 이내로.\n\n로그:\n"

          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg prompt "$PROMPT" --arg log "$ERROR_LOG" '{
              contents: [{ parts: [{ text: ($prompt + $log) }] }],
              generationConfig: { maxOutputTokens: 300 }
            }')")

          ANALYSIS=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "AI 분석 실패: API 키를 확인해주세요."' | head -10)

          # GitHub Output에 저장
          echo "analysis<<ANALYSIS_EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "ANALYSIS_EOF" >> $GITHUB_OUTPUT

      # 10. 슬랙 알림 (실패 + AI 분석 포함)
      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ WebGL 빌드 실패"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    🔥 *${{ github.repository }}* 빌드 실패!
                    📝 커밋: ${{ github.event.head_commit.message }}
                    👤 작성자: ${{ github.actor }}
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    🤖 *AI 분석 결과:*
                    ${{ steps.gemini.outputs.analysis }}
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|전체 로그 확인>